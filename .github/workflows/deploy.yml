name: Deploy React app to GitHub Pages

on:
  push:
    branches:
      - Ashnab-New
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: npm ci
      - name: Build production app
        run: npm run build
      - name: Verify Pages build output
        run: |
          test -f build/index.html
          node -e "const fs=require('fs');const path=require('path');const html=fs.readFileSync('build/index.html','utf8');const base='/Amreen-Consultancy/';const urls=[...html.matchAll(/(?:src|href)=\"([^\"]+)\"/g)].map(([,url])=>url).filter(url=>url.startsWith(base));if(!urls.some(url=>url.endsWith('.js'))||!urls.some(url=>url.endsWith('.css'))||urls.some(url=>!fs.existsSync(path.join('build',url.slice(base.length))))){console.error('Missing project-prefixed JavaScript or CSS asset in build output');process.exit(1)}"
      - name: Upload production build
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
